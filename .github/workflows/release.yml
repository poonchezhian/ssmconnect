# Builds SSMConnect on every push / pull request (to catch breakage) and, when a version tag such as v1.1.0 is pushed,
# publishes a GitHub Release with the setup file. The app checks that Release once a day and offers an in-place update.
name: build-and-release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to create the release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Work out the version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $v = $env:GITHUB_REF.Substring('refs/tags/v'.Length) }
          else { $v = "0.0.$env:GITHUB_RUN_NUMBER" }
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $file = (Get-Content VERSION -Raw).Trim()
            if ($file -ne $v) { throw "Tag v$v does not match the VERSION file ($file). Update VERSION, commit, and re-tag." }
          }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build the installer
        shell: pwsh
        run: ./build.ps1 -Version ${{ steps.ver.outputs.version }}

      - name: Prepare release files
        id: files
        shell: pwsh
        run: |
          $exe = Get-ChildItem installer/output/SSMConnect-Setup-*-x64.exe | Select-Object -First 1
          if (-not $exe) { throw 'Setup file was not produced.' }
          # stable name, so README can link to .../releases/latest/download/SSMConnect-Setup-x64.exe
          Copy-Item $exe.FullName installer/output/SSMConnect-Setup-x64.exe
          $lines = foreach ($f in $exe.FullName, 'installer/output/SSMConnect-Setup-x64.exe') {
            $h = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            "$h  $(Split-Path $f -Leaf)"
          }
          $lines | Set-Content installer/output/SHA256SUMS.txt -Encoding ascii
          Get-Content installer/output/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: SSMConnect-Setup
          path: |
            installer/output/*.exe
            installer/output/SHA256SUMS.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            installer/output/SSMConnect-Setup-*-x64.exe
            installer/output/SSMConnect-Setup-x64.exe
            installer/output/SHA256SUMS.txt
