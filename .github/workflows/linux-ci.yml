# Linux edition only. Runs on the `linux` branch and on linux-v* tags; never touches the Windows workflow.
# Release: scripts/bump-version.sh, update CHANGELOG.md, commit, then
#   git tag -a linux-vX.Y.Z -m "SSMConnect for Linux X.Y.Z" && git push origin linux --follow-tags
name: linux-build-and-release

on:
  push:
    branches: [linux]
    tags: ['linux-v*']
  pull_request:
    branches: [linux]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: linux

env:
  CARGO_TERM_COLOR: never

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libadwaita-1-dev openssh-client openssl python3 desktop-file-utils appstream
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            linux/target
          key: cargo-${{ hashFiles('linux/Cargo.lock') }}
      - run: cargo build --locked --all-targets
      - run: cargo test --locked
      - name: Version files agree
        run: |
          v=$(cat VERSION)
          test "$v" = "$(sed -n '0,/^version = "\(.*\)"/s//\1/p' Cargo.toml | head -1)"
          grep -q "release version=\"$v\"" data/*.metainfo.xml
      - name: Tag matches the version and the changelog
        if: startsWith(github.ref, 'refs/tags/linux-v')
        run: |
          test "linux-v$(cat VERSION)" = "${GITHUB_REF_NAME}"
          grep -q "^## \[$(cat VERSION)\]" CHANGELOG.md
      - run: desktop-file-validate data/*.desktop && appstreamcli validate --no-net data/*.metainfo.xml

  # Downloads Amazon's real packages and signatures and checks them against the built-in keys. If AWS ever rotates a key this turns red
  # (it does not block releases): that is the signal to ship the new key.
  signature-live:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libadwaita-1-dev
      - run: SSMCONNECT_NET_TESTS=1 cargo test --locked --test signature

  package:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libadwaita-1-dev
      - run: packaging/build-tarball.sh && packaging/build-deb.sh
      - name: Smoke-test the tarball install
        run: |
          d=$(mktemp -d); tar -C "$d" -xzf dist-linux/ssmconnect-*-linux-*.tar.gz
          "$d"/ssmconnect-*/install.sh --prefix "$d/p" && HOME="$d" "$d/p/bin/ssmconnect" --version
      - name: Smoke-test the deb
        run: sudo apt-get install -y ./dist-linux/ssmconnect_*.deb && ssmconnect --version && ssmconnect doctor || true
      - uses: actions/upload-artifact@v4
        with:
          name: ssmconnect-linux-deb-tarball
          path: linux/dist-linux/*

  rpm:
    needs: test
    runs-on: ubuntu-24.04
    container: fedora:latest
    steps:
      - run: dnf install -y git cargo rust gcc gtk4-devel libadwaita-devel rpm-build openssh-clients
      - uses: actions/checkout@v4
      - run: packaging/build-rpm.sh
      - name: Smoke-test the rpm
        run: dnf install -y dist-linux/ssmconnect-*.rpm && ssmconnect --version
      - uses: actions/upload-artifact@v4
        with:
          name: ssmconnect-linux-rpm
          path: linux/dist-linux/*.rpm

  release:
    if: startsWith(github.ref, 'refs/tags/linux-v')
    needs: [package, rpm]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ssmconnect-linux-*
          merge-multiple: true
          path: dist
      - name: Checksums and release notes (from the changelog)
        run: |
          (cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          v="${GITHUB_REF_NAME#linux-v}"
          awk -v v="$v" '$0 ~ "^## \\["v"\\]" {on=1; next} /^## \[/ {on=0} on' linux/CHANGELOG.md > notes.md
          { echo; echo "Linux edition (native, Rust + GTK 4). Verify downloads with \`sha256sum -c SHA256SUMS.txt\`."; } >> notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""; case "${GITHUB_REF_NAME}" in linux-v0.*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "SSMConnect for Linux ${GITHUB_REF_NAME#linux-v}" --notes-file notes.md $pre
